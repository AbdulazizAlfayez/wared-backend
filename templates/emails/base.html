<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>{% block subject %}Wared{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#1a1a1a;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation"
         style="background-color:#f5f5f5;padding:32px 16px;">
    <tr>
      <td align="center">

        <table width="600" cellpadding="0" cellspacing="0" border="0" role="presentation"
               style="max-width:600px;width:100%;">

          <!-- ═══ HEADER — black bar with WARED wordmark ═══ -->
          <tr>
            <td style="background-color:#0a0a0a;border-radius:12px 12px 0 0;padding:24px 40px;text-align:center;">
              <a href="{{ frontend_url|default:'https://wared.sa' }}" style="text-decoration:none;">
                <span style="font-size:22px;font-weight:700;color:#ffffff;letter-spacing:6px;text-transform:uppercase;">WARED</span>
              </a>
              <p style="margin:4px 0 0;font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:1px;">
                وارد &nbsp;·&nbsp; Vehicle Import Platform
              </p>
            </td>
          </tr>

          <!-- ═══ CONTENT CARD ═══ -->
          <tr>
            <td style="background-color:#ffffff;padding:40px 40px 32px;border-left:1px solid #e5e5e5;border-right:1px solid #e5e5e5;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- ═══ FOOTER ═══ -->
          <tr>
            <td style="background-color:#fafafa;border:1px solid #e5e5e5;border-top:none;border-radius:0 0 12px 12px;padding:24px 40px;text-align:center;">
              <p style="margin:0 0 8px;font-size:12px;color:#999999;letter-spacing:0.3px;">
                © {{ current_year }} Wared — وارد &nbsp;|&nbsp; Riyadh, Saudi Arabia
              </p>
              <p style="margin:0;font-size:11px;color:#bbbbbb;line-height:1.6;">
                You're receiving this because you have an account on Wared.<br>
                <a href="mailto:support@wared.sa" style="color:#0a0a0a;text-decoration:underline;">support@wared.sa</a>
                &nbsp;&nbsp;·&nbsp;&nbsp;
                <a href="{{ frontend_url|default:'https://wared.sa' }}/profile" style="color:#0a0a0a;text-decoration:underline;">Account settings</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
